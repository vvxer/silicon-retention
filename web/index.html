<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>硅基保留</title>
<style>
  :root { --bg: #f6f5f2; --panel: #ffffff; --text: #22201c; --muted: #8a857c; --me: #e7eefc; --line: #e4e1da; --accent: #3a6ea5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --panel: #202124; --text: #e8e6e1; --muted: #8f8b84; --me: #24324a; --line: #2e3034; --accent: #7aa7e0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 0 16px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .st { color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 16px 0; }
  .msg { white-space: pre-wrap; padding: 10px 14px; border-radius: 12px; margin: 8px 0; max-width: 88%; }
  .me { background: var(--me); margin-left: auto; }
  .ai { background: var(--panel); border: 1px solid var(--line); }
  .meta { color: var(--muted); font-size: 12px; margin: -4px 0 8px 4px; }
  form { display: flex; gap: 8px; padding: 12px 0 18px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; height: 52px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
             background: var(--panel); color: var(--text); font: inherit; }
  button { border: 0; border-radius: 10px; padding: 0 16px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; font-size: 13px; }
  button:disabled { opacity: .5; cursor: default; }
  select { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; font-size: 13px; padding: 3px 6px; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">硅基保留</h1>
    <div class="bar">
      <span class="st" id="st"></span>
      <select id="speed" title="越往右越像她，但回答越慢">
        <option value="fast">快</option><option value="medium">均衡</option><option value="strong">像她</option>
      </select>
      <button class="ghost" id="new">新对话</button>
    </div>
  </header>
  <div id="log"></div>
  <form id="f">
    <textarea id="t" placeholder="说点什么……（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="b">发送</button>
  </form>
</div>
<script>
const log = document.getElementById('log'), t = document.getElementById('t'), b = document.getElementById('b');
const sp = document.getElementById('speed');
let session = Math.random().toString(36).slice(2);
function remembered() { try { return localStorage.getItem('speed'); } catch (e) { return null; } }
sp.onchange = () => { try { localStorage.setItem('speed', sp.value); } catch (e) {} };
fetch('/api/status').then(r => r.json()).then(s => {
  document.getElementById('st').textContent = (s.lora ? 'LoRA 已启用' : '仅 DeepSeek') + ' · 记忆 ' + s.memory_days + ' 天';
  if (s.ai_name) { document.getElementById('title').textContent = s.ai_name; document.title = s.ai_name + ' · 硅基保留'; }
  sp.value = remembered() || s.speed || 'medium';
  sp.disabled = !s.lora;
});
document.getElementById('new').onclick = () => { session = Math.random().toString(36).slice(2); log.innerHTML = ''; };
function add(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; log.appendChild(d);
  log.scrollTop = log.scrollHeight; return d;
}
t.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); } });
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const msg = t.value.trim(); if (!msg) return;
  t.value = ''; b.disabled = true; add('me', msg);
  const ai = add('ai', ''), t0 = performance.now();
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                         body: JSON.stringify({ message: msg, session, speed: sp.value }) });
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1); if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === 'delta') { ai.textContent += ev.text; log.scrollTop = log.scrollHeight; }
        else if (ev.type === 'error') { ai.textContent += '\n[出错] ' + ev.message; }
        else if (ev.type === 'done') {
          const m = document.createElement('div'); m.className = 'meta';
          const s = ev.stats || {};
          m.textContent = ((performance.now() - t0) / 1000).toFixed(1) + ' 秒' + (s.rejections !== undefined ? ' · 改写 ' + s.rejections + ' 次' : '');
          log.appendChild(m);
        }
      }
    }
  } catch (err) { ai.textContent += '\n[连接失败] ' + err; }
  b.disabled = false; t.focus();
};
</script>
</body>
</html>
